---
layout: main
---
<article class="post">
    <header class="header">
        <div class="content">
            <h1 class="title">{{ page.title }}</h1>
            <p class="description">{{ page.description }}</p>
            <p class="byline"><span class="seal seal-small" aria-hidden="true">鯉</span><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
        </div>
    </header>
    <div class="post-content">
        {{ content }}
        <div class="end-mark" aria-hidden="true"><span class="seal">鯉</span></div>
    </div>

    <div class="comments-block">
        <h2 class="section-title">Comments</h2>
        <p>Let me know what you think!</p>
    </div>
    <div id="disqus_thread"></div>
    <script type="text/javascript">
        /* * * CONFIGURATION VARIABLES * * */
        var disqus_shortname = 'binarynirvana';
        var disqus_identifier = '{{ page.url }}';

        /* * * DON'T EDIT BELOW THIS LINE * * */
        (function() {
            var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true;
            dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js';
            (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);
        })();
    </script>
    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a></noscript>
</article>
