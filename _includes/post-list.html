{% comment %}Renders dated post entries. Usage: include post-list.html posts=site.posts{% endcomment %}
<ul class="entries">
{% for post in include.posts %}
    <li>
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
        <div>
            <p class="title"><a href="{{ post.url }}">{{ post.title }}</a></p>
            <p class="blurb">{{ post.blurb }}</p>
            <p class="tags">{% for tag in post.tags %}<span>#{{ tag }}</span>{% endfor %}</p>
        </div>
    </li>
{% endfor %}
</ul>
