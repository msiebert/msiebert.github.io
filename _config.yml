exclude: [assets/less, docker, WRITING_STYLE_GUIDE.md]

defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
      type: "posts" # previously `post` in Jekyll 2.2.
    values:
      layout: "post"
      author: "Mark Siebert"

domain: "https://msiebert.github.io/"
title: "Binary Nirvana"
description: "One half Asian's ruminations on the path to digital enlightenment."
# Default link preview image (path under assets/img). A page or post can set
# its own with `image:` in its front matter.
share_image: social-card.png

plugins:
  - jekyll-sitemap
