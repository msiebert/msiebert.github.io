- title: Tally
  blurb: "I wanted a todo list that took zero effort to keep up, so I built one my agent manages for me. Tally is a local MCP server with no UI (Claude is the interface). Errors tell the agent exactly how to fix its mistake, and each list carries its own instructions so I don't have to repeat myself."
