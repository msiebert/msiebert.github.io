- title: Shark Fam
  blurb: An experiment in how far Claude can get at making 3D models. I surveyed the options (scripted Blender, AI mesh generators, three.js) and settled on parametric Blender models swimming around in three.js. It ended up a browsable shark family tree, but the sharks are a side effect. The real project is learning to make 3D with Claude.
  image: shark-fam-mark.jpg
