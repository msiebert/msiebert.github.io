- title: Shark Fam
  blurb: "I wanted to find out whether Claude can make decent 3D models, and how to get it there. So we looked at a bunch of options (scripted Blender, AI mesh generators, plain three.js) and ended up with parametric Blender models swimming around in three.js. Somehow that turned into a browsable shark family tree (the sharks were honestly a side effect). The real project is learning how to make 3D things with Claude."
