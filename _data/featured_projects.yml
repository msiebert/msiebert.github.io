- title: Wenchang
  blurb: A Python library that gives AI agents persistent, self-organizing memory. It is a virtual filesystem of markdown files in GCS, exposed as tools with optimistic concurrency and scope-based authorization.
  icon: fa-book
  tags: [Python, AI agents, GCS]
